name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck

  db-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Spins up a fresh local Postgres via Docker and applies every migration
      # in supabase/migrations/ in order -- this is what actually proves the
      # migration history in this PR is internally consistent and applies
      # cleanly from scratch, independent of whatever state the live project
      # happens to be in. Plain `start` (no --exclude) since this job has
      # never been run end-to-end yet -- the full default stack is the most
      # tested path; trim it for speed once it's confirmed green.
      - run: supabase start
      - run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/regressions.sql
