name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run ui:a11y
      - run: npm run typecheck

  web-build-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run security:env
      - run: npm run build:web
      - run: npm run security:bundle

  db-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0
      - run: supabase --version
      # Spins up a fresh local Postgres via Docker and applies every migration
      # in supabase/migrations/ in order -- this is what actually proves the
      # migration history in this PR is internally consistent and applies
      # cleanly from scratch, independent of whatever state the live project
      # happens to be in. Confirmed green end-to-end as of 2026-09-07 (full
      # 212-migration history restoration). Plain `start` (no --exclude) --
      # trim it for speed if it becomes a bottleneck.
      - run: supabase start
      - run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/regressions.sql
